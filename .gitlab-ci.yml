    LAVA_TEST_WATCHDOG: true
    FS_VARIANT: minimal

.lava-test-wifi:
  variables:
    LAVA_TEST: wifi
    LAVA_TEST_WIFI: true
    FS_VARIANT: minimal

.lava-test-avvideocompare:
  variables:
    LAVA_TEST_AVVIDEOCOMPARE: true
    FS_VARIANT: gnome

.lava-test-avvideocompare-jpeg:
  extends:
    - .lava-test-avvideocompare
  variables:
    LAVA_TEST: avvideocompare jpeg
    AVVIDEOCOMPARE_GST_PIPELINE1: "v4l2jpegenc ! v4l2jpegdec"
    AVVIDEOCOMPARE_GST_PIPELINE2: "jpegenc ! jpegdec"
    AVVIDEOCOMPARE_GST_VID_SRC_MEDIA_TYPE: "video/x-raw,framerate=30/1,width=1920,height=1080,format=NV12"
    AVVIDEOCOMPARE_MIN_SCORE: 0.99

.lava-test-avvideocompare-mdp:
  extends:
    - .lava-test-avvideocompare
  variables:
    LAVA_TEST: avvideocompare mdp
    AVVIDEOCOMPARE_GST_PIPELINE1: "v4l2convert ! video/x-raw,format=UYVY"
    AVVIDEOCOMPARE_GST_PIPELINE2: "videoconvert ! video/x-raw,format=UYVY"
    AVVIDEOCOMPARE_GST_VID_SRC_MEDIA_TYPE: "video/x-raw,framerate=30/1,width=1920,height=1080,format=NV12"
    AVVIDEOCOMPARE_MIN_SCORE: 0.999

.lava-test-fluster:
