default:
  image: debian:testing

stages:
  - build
  - test
  - generate
  - lava

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"

check-devicetrees:
  stage: build
  tags:
    - ultra-heavyweight
  variables:
    DEBIAN_FRONTEND: noninteractive
    GIT_SUBMODULE_STRATEGY: normal
    ARCH: arm64
    DEFCONFIG: defconfig
    CROSS_COMPILE: aarch64-linux-gnu-
    DUT_LIST: "mt8196-rauru-navi-sku2 \
               mt8365-evk \
               mt8370-genio-510-evk \
               mt8390-genio-700-evk \
               mt8395-genio-1200-evk \
               mt8395-radxa-nio-12l "
  before_script:
    - apt update
    - apt install -y devscripts
                     build-essential
                     crossbuild-essential-arm64
                     bc
                     bison
                     flex
                     swig
                     python3-dev
                     python3-pip
                     python3-setuptools
                     yamllint
    - pip3 install --break-system-packages dtschema
  script:
    - make $DEFCONFIG
    - make -j$(nproc) dt_binding_check
    - DT_WARNINGS=false
    - for DUT in ${DUT_LIST}; do
         DT_WARNING_FILE="dt-warnings-${DUT}.txt";
         make -j$(nproc) CHECK_DTBS=y mediatek/${DUT}.dtb 2> ${DT_WARNING_FILE};
         if [[ $(cat ${DT_WARNING_FILE} | wc -l) > 0 ]] ; then
             cat ${DT_WARNING_FILE};
             DT_WARNINGS=true;
         fi;
      done
    - if [ ${DT_WARNINGS} = true ] ; then exit 42; fi
  allow_failure:
    exit_codes:
      - 42
  artifacts:
    when: on_failure
    paths:
      - dt-warnings-*.txt

.build-debian-package:
  stage: build
  tags:
    - ultra-heavyweight
  cache:
    when: on_success
    key: $CI_COMMIT_REF_SLUG
    paths:
      - ccache
  variables:
    DEBIAN_FRONTEND: noninteractive
    GIT_SUBMODULE_STRATEGY: normal
    ARCH: amd64
    DEFCONFIG: defconfig
    CCACHE_BASEDIR: $CI_PROJECT_DIR
    CCACHE_DIR: $CI_PROJECT_DIR/ccache
  before_script:
    - dpkg --add-architecture arm64
    - apt update
    - apt install -y devscripts
                     build-essential
                     crossbuild-essential-arm64
                     bc
                     bison
                     ccache
                     flex
                     rsync
                     kmod
                     cpio
                     libdw-dev
                     libelf-dev
                     libssl-dev
                     libssl-dev:arm64
    # Setup ccache
    - export PATH="/usr/lib/ccache:$PATH"
    - ccache -s
  script:
    - make $DEFCONFIG
    - make -j$(nproc) $ADDITIONAL_BUILD_CMD bindeb-pkg
    - mkdir artifacts && dcmd mv ../*.changes artifacts/
  artifacts:
    paths:
      - artifacts

.build-kselftest-tarball:
  stage: build
  cache:
    when: on_success
    key: $CI_COMMIT_REF_SLUG
    paths:
      - ccache
  variables:
    DEBIAN_FRONTEND: noninteractive
    GIT_SUBMODULE_STRATEGY: normal
    ARCH: amd64
    DEFCONFIG: defconfig
    CCACHE_BASEDIR: $CI_PROJECT_DIR
    CCACHE_DIR: $CI_PROJECT_DIR/ccache
  before_script:
    - dpkg --add-architecture arm64
    - apt update
    - apt install -y devscripts
                     build-essential
                     crossbuild-essential-arm64
                     bc
                     bison
                     ccache
                     flex
                     rsync
                     kmod
                     cpio
                     libelf-dev
                     libssl-dev
                     libssl-dev:arm64
    - mkdir artifacts
    # Setup ccache
    - export PATH="/usr/lib/ccache:$PATH"
    - ccache -s
  script:
    - echo 'linaro,optee-tz' >> tools/testing/selftests/dt/compatible_ignore_list
    - make -C tools/testing/selftests/ TARGETS="dt" gen_tar
    - mv tools/testing/selftests/kselftest_install/kselftest-packages/kselftest.tar.gz artifacts/
    - sed -i s,%%KSELFTEST_BUILD_JOB%%,${CI_JOB_ID},g lava/testjob.yaml
  artifacts:
    paths:
      - artifacts
      - lava/testjob.yaml

build-arm64-debian-package:
  extends: .build-debian-package
  variables:
    ARCH: arm64
    CROSS_COMPILE: aarch64-linux-gnu-
    ADDITIONAL_BUILD_CMD: KBUILD_IMAGE=arch/arm64/boot/Image

build-arm64-kselftest:
  extends: .build-kselftest-tarball
  variables:
    ARCH: arm64
    CROSS_COMPILE: aarch64-linux-gnu-

generate-tests:
  image: debian:trixie-slim
  stage: generate
  tags:
    - lightweight
  dependencies:
    - build-arm64-debian-package
    - build-arm64-kselftest
  before_script:
    - apt update
    - apt install -y zstd
  script:
    - mkdir deb
    - "for x in artifacts/linux-image*.deb ; do dpkg -x ${x} deb ; done"
    - cp deb/boot/vmlinuz* vmlinuz
    - tar -f modules.tar.zst -C deb -c --zstd -v lib/modules
    - mkdir dtbs
    - cp -r deb/usr/lib/linux-image*/* dtbs
    - sed -i s,%%KERNEL_BUILD_JOB%%,${CI_JOB_ID},g lava/testjob.yaml
  artifacts:
    paths:
      - vmlinuz
      - modules.tar.zst
      - dtbs
      - lava/testjob.yaml

.lava-test:
  stage: lava
  tags:
    - lava-runner
  rules:
    - if: $LAVA_TOKEN
  script:
    - submit lava/testjob.yaml
  dependencies:
    - generate-tests
  artifacts:
    when: always
    paths:
      - "*"
    reports:
      junit: "*_junit.xml"

.genio-350:
  variables:
    DEVICE_TYPE: mt8365-genio-350-evk
    DTB: mt8365-evk
    GLMARK2_RENDERER: "Mali-G52 r1 (Panfrost)"
    GLMARK2_MIN_SCORE: 100

.genio-510:
