    LAVA_TEST: dmesg
    LAVA_TEST_DMESG: true
    FS_VARIANT: minimal
  allow_failure: true

.lava-test-kselftest-dt:
  variables:
    LAVA_TEST: kselftest-dt
    LAVA_TEST_KSELFTEST_DT: true
    FS_VARIANT: minimal

.lava-test-glmark2:
