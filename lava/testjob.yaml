device_type:  {{ job.DEVICE_TYPE }}

job_name: MediaTek AIoT {{ job.LAVA_TEST }} test {{job.CI_JOB_ID}}
timeouts:
  job:
    minutes: 15
  action:
   minutes: 5
visibility: public

context:
  extra_kernel_args: rootwait

actions:
  - deploy:
      timeout:
        minutes: 5
      timeouts:
        http-download:
          minutes: 5 {{! Workaround for http-download timeout divided by number of retries}}
      to: tftp
      kernel:
        url: "{{job.CI_PROJECT_URL}}/-/jobs/%%KERNEL_BUILD_JOB%%/artifacts/raw/vmlinuz"
        type: image
      modules:
        url: "{{job.CI_PROJECT_URL}}/-/jobs/%%KERNEL_BUILD_JOB%%/artifacts/raw/modules.tar.zst"
        compression: zstd
      dtb:
        url: "{{job.CI_PROJECT_URL}}/-/jobs/%%KERNEL_BUILD_JOB%%/artifacts/raw/dtbs/mediatek/{{ job.DTB }}.dtb"
      ramdisk:
        url: "https://gitlab.collabora.com/mediatek/aiot/debian-image-recipes/-/jobs/artifacts/main/raw/out/trixie-arm64-{{ job.FS_VARIANT }}-initramfs.cpio.zst?job=build-lava-debian-{{ job.FS_VARIANT }}-fs"
        compression: zstd
      nfsrootfs:
        url: "https://gitlab.collabora.com/mediatek/aiot/debian-image-recipes/-/jobs/artifacts/main/raw/out/trixie-arm64-{{ job.FS_VARIANT }}-rootfs.tar.zst?job=build-lava-debian-{{ job.FS_VARIANT }}-fs"
        compression: zstd

  - boot:
      method: u-boot
      commands: nfs
      timeout:
        minutes: 10
      auto_login:
        login_prompt: 'login:'
        username: user
        password_prompt: 'Password:'
        password: user
        login_commands:
          - sudo su
          - resolvectl dns end0 $(grep 'nameserver' /proc/net/pnp | cut -d' ' -f2)
          - systemctl restart systemd-timesyncd
      prompts:
        - 'user@debian-trixie(.*)$'
        - 'root@debian-trixie(.*)#'

{{ #if job.LAVA_TEST_WATCHDOG }}
  - test:
      timeout:
        minutes: 5
      interactive:
      - name: wdt-reset
        prompts: ['root@debian-trixie(.*)#']
        script:
        - name: wdt-get-timeout
          command: "wdt_timeout=$(cat /sys/class/watchdog/watchdog0/timeout)"
          wait_for_prompt: true
          failures:
          - message: "cat: /sys/class/watchdog/watchdog\\d+/timeout: No such file or directory"
            exception: JobError
        - name: wdt-trigger-reset
          command: "sleep $((wdt_timeout + 5)) > /dev/watchdog0"
          wait_for_prompt: false
          successes:
          - message: U-Boot
{{ /if }}
{{ #if job.LAVA_TEST_DMESG }}
  - test:
      definitions:
        - from: git
          name: dmesg
          path: dmesg/dmesg.yaml
          repository: https://gitlab.collabora.com/mediatek/aiot/lava-test-definitions.git
          revision: main
          parameters:
            LEVELS: "crit,alert,emerg,err,warn"
      timeout:
        minutes: 10
{{ /if }}
{{ #if job.LAVA_TEST_KSELFTEST_DT }}
  - test:
      definitions:
      - from: git
        name: kselftest-dt
        parameters:
          ENV: ''
          SKIPFILE: /dev/null
          SKIP_INSTALL: true
          TESTPROG_URL: "{{job.CI_PROJECT_URL}}/-/jobs/%%KSELFTEST_BUILD_JOB%%/artifacts/raw/artifacts/kselftest.tar.gz"
          TST_CASENAME: ''
          TST_CMDFILES: dt
        path: automated/linux/kselftest/kselftest.yaml
        repository: https://github.com/kernelci/test-definitions.git
        revision: kernelci.org
      timeout:
        minutes: 10
{{ /if }}
{{ #if job.LAVA_TEST_GLMARK2 }}
  - test:
      definitions:
        - from: git
          name: glmark2
          path: glmark2/glmark2.yaml
          repository: https://gitlab.collabora.com/mediatek/aiot/lava-test-definitions.git
          revision: main
          parameters:
            RENDERER_STRING: {{ job.GLMARK2_RENDERER }}
            MINIMUM_SCORE: {{ job.GLMARK2_MIN_SCORE }}
      timeout:
        minutes: 10
{{ /if }}
{{ #if job.LAVA_TEST_WIFI }}
  - test:
