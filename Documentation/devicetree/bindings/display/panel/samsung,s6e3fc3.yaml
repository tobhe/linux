%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/samsung,s6e3fc3.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S6E3FC3 Display Driver IC AMOLED DSI panels

maintainers:
  - AngeloGioacchino Del Regno <angelogioacchino.delregno@collabora.com>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    items:
      - enum:
          - samsung,ams643ye05
          - samsung,ams646yd04
          - samsung,ams667ym01
      - const: samsung,s6e3fc3

  reg:
    maxItems: 1

  reset-gpios: true

  port: true

  vddio-supply:
    description: VDDIO regulator

  vci-supply:
    description: VCI regulator

required:
  - compatible
  - reset-gpios
  - vddio-supply
  - vci-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "samsung,ams643ye05", "samsung,s6e3fc3";
            reg = <0>;
            vddio-supply = <&mt6362_vmc_ldo_reg>;
            vci-supply = <&mt6362_vfp_ldo_reg>;
            reset-gpios = <&pio 42 GPIO_ACTIVE_HIGH>;
            pinctrl-0 = <&panel_default_pins>;
            pinctrl-names = "default";

            port {
                panel_in: endpoint {
                    remote-endpoint = <&mdss_dsi0_out>;
                };
            };
        };
    };

...
